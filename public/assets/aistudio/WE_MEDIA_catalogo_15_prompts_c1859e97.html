const storageKey='wemedia-catalog-v1';
let items;try{const stored=JSON.parse(localStorage.getItem(storageKey));items=Array.isArray(stored)?stored:seed}catch{items=seed}
let currentId=null,editId=null;
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(items))}catch(e){alert('Não foi possível salvar no navegador. Exporte um backup JSON para não perder os dados.')}}
function categoryOf(name){name=name.toLowerCase();if(name.includes('aniver'))return 'Aniversário';if(name.includes('casal'))return 'Casais';if(name.includes('profissional'))return 'Profissional';if(name.includes('casual'))return 'Casual';if(name.includes('gestante'))return 'Gestante';return 'Outros'}
function render(){const q=document.getElementById('search').value.toLowerCase(),cat=document.getElementById('category').value;const selected=items.filter(x=>(x.title.toLowerCase().includes(q)||x.prompt.toLowerCase().includes(q))&&(!cat||categoryOf(x.title)===cat));document.getElementById('count').textContent=selected.length+' referências';const grid=document.getElementById('grid');grid.replaceChildren();for(const x of selected){const card=document.createElement('div');card.className='card';const img=document.createElement('img');img.className='thumb';img.loading='lazy';img.alt=x.title;img.src=x.image;img.onclick=()=>viewItem(x.id);const fallback=document.createElement('div');fallback.className='fallback';fallback.textContent='Imagem indisponível · Abrir referência';fallback.onclick=()=>window.open(x.image,'_blank','noopener');img.onerror=()=>{img.style.display='none';fallback.style.display='flex'};const body=document.createElement('div');body.className='cardbody';const title=document.createElement('div');title.className='name';title.textContent=x.title;const actions=document.createElement('div');actions.className='actions';const copy=document.createElement('button');copy.className='gold';copy.textContent='COPIAR PROMPT';copy.onclick=()=>copyPrompt(x.id,copy);const open=document.createElement('button');open.className='secondary';open.textContent='Ver';open.onclick=()=>viewItem(x.id);actions.append(copy,open);body.append(title,actions);card.append(img,fallback,body);grid.append(card)}if(!selected.length)grid.innerHTML='<p class="empty">Nenhuma referência encontrada.</p>'}
async function copyPrompt(id,btn){const x=items.find(v=>v.id===id);if(!x)return;try{await navigator.clipboard.writeText(x.prompt)}catch(e){const t=document.createElement('textarea');t.value=x.prompt;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok){alert('Não foi possível copiar automaticamente. Abra o prompt para selecionar o texto.');return}}const old=btn.textContent;btn.textContent='✓ Prompt copiado!';setTimeout(()=>btn.textContent=old,1800)}
function viewItem(id){const x=items.find(v=>v.id===id);currentId=id;document.getElementById('viewtitle').textContent=x.title;document.getElementById('viewprompt').value=x.prompt;document.getElementById('viewlink').href=x.image;viewer.showModal()}
function addItem(){editId=null;document.getElementById('edtitle').textContent='Adicionar referência';edname.value='';edimage.value='';edprompt.value='';editor.showModal()}
function editItem(id){const x=items.find(v=>v.id===id);editId=id;edname.value=x.title;edimage.value=x.image;edprompt.value=x.prompt;viewer.close();editor.showModal()}
function saveItem(){const title=edname.value.trim(),image=edimage.value.trim(),prompt=edprompt.value;if(!title||!image||!prompt.trim()){alert('Preencha título, URL e prompt.');return}if(!/^https:\/\//i.test(image)){alert('Use uma URL https válida.');return}if(editId!==null){Object.assign(items.find(v=>v.id===editId),{title,image,prompt})}else items.push({id:Math.max(0,...items.map(x=>x.id))+1,title,image,prompt});persist();editor.close();render()}
function deleteItem(id){if(!confirm('Excluir esta referência?'))return;items=items.filter(v=>v.id!==id);persist();viewer.close();render()}
function exportData(){const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='we-media-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(e){const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(x=>typeof x.title==='string'&&typeof x.image==='string'&&typeof x.prompt==='string'))throw Error('Formato inválido');if(confirm('Substituir o catálogo atual pelo backup importado?')){items=data;persist();render()}}catch(err){alert('Arquivo inválido: '+err.message)}e.target.value=''}
